  <style>
    :root{--ink:#16312d;--muted:#60746f;--line:#d7e4e0;--paper:#fff;--brand:#087f72;--soft:#eff8f6;--heritage:#7752b5;--leisure:#17805a}
    body.theme-dark{--ink:#edf5f8;--muted:#a9bdc8;--line:#294554;--paper:#0d1b27;--brand:#38c6b4;--soft:#07131d;background:#07131d}.theme-toggle{border:1px solid var(--line);border-radius:999px;background:var(--paper);color:var(--ink);padding:8px 12px;font-weight:750;cursor:pointer}.theme-toggle:hover{border-color:var(--brand);color:var(--brand)}
    *{box-sizing:border-box} body{margin:0;background:var(--soft);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif} button,input{font:inherit}
    .page{width:min(1440px,calc(100% - 32px));margin:24px auto}.head{display:flex;justify-content:space-between;gap:18px;align-items:center;margin-bottom:14px}.head h1{font-size:clamp(1.6rem,3vw,2.25rem);letter-spacing:-.045em;margin:0}.head p{margin:3px 0 0;color:var(--muted)}.back{color:var(--brand);font-weight:750;text-decoration:none;white-space:nowrap}
    .explorer{display:grid;grid-template-columns:350px minmax(0,1fr);height:min(76vh,780px);min-height:560px;background:var(--paper);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 18px 50px #16473d16}.sidebar{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line);background:#fbfefd}.search-wrap{padding:16px 16px 12px;border-bottom:1px solid var(--line)}.search{width:100%;padding:12px 14px;border:1px solid #c7dbd6;border-radius:12px;background:#fff;outline:none}.search:focus{border-color:var(--brand);box-shadow:0 0 0 3px #087f721f}.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.chip{border:1px solid #cfe0dc;border-radius:999px;background:#fff;padding:6px 9px;color:#3e5953;font-size:.78rem;font-weight:700;cursor:pointer}.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:white}.results{overflow:auto;padding:10px}.results-status{padding:2px 5px 8px;color:var(--muted);font-size:.82rem}.result{display:grid;grid-template-columns:62px 1fr;gap:10px;width:100%;padding:9px;border:0;border-radius:12px;background:transparent;text-align:left;color:inherit;cursor:pointer}.result:hover,.result.active{background:#eaf6f3}.result-media{width:62px;height:62px;border-radius:9px;object-fit:cover;background:#dbece8}.result-placeholder{display:grid;place-items:center;color:#fff;font-weight:800;background:linear-gradient(135deg,#087f72,#58a89c)}.result h3{margin:0;font-size:.94rem;line-height:1.25}.result p{margin:3px 0 0;color:var(--muted);font-size:.79rem}.labels{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}.label{display:inline-flex;padding:2px 6px;border-radius:999px;background:#e5f3f0;color:#087064;font-size:.68rem;font-weight:750}.tag-historico{background:#eee8ff;color:#6541a8}.tag-cultural{background:#f2e8ff;color:#7a3fa3}.tag-religioso{background:#fff1d9;color:#9b5a10}.tag-infantil{background:#fff0f5;color:#b03669}.tag-imperdible{background:#e4f8f3;color:#087064}.tag-deportes{background:#e1f1ff;color:#1767a5}.tag-gastronomia{background:#fff0e1;color:#a45417}.tag-musica{background:#f8e6f1;color:#9b2f6f}.tag-feria{background:#f3f1d8;color:#6f6917}.map-zone{position:relative;min-width:0}#map{height:100%;width:100%}.detail{position:absolute;z-index:800;left:18px;bottom:18px;width:min(340px,calc(100% - 36px));max-height:calc(100% - 36px);overflow:auto;background:#fff;border:1px solid #d8e6e2;border-radius:17px;box-shadow:0 16px 40px #183d3550}.detail[hidden]{display:none}.detail-media{display:block;width:100%;height:152px;object-fit:cover;background:#e7f3f0}.detail-placeholder{display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#087f72,#58a89c);font-size:2rem;font-weight:800}.detail-body{padding:14px}.detail-close{float:right;border:0;background:#edf5f3;color:var(--ink);border-radius:50%;width:30px;height:30px;cursor:pointer}.detail h2{margin:0 35px 6px 0;font-size:1.18rem;line-height:1.25}.detail-summary{margin:10px 0;color:#405d56}.detail-more{margin:0;color:#405d56}.detail-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.action{border:1px solid #bcd9d3;border-radius:10px;padding:8px 10px;background:#fff;color:#087064;font-weight:750;text-decoration:none;cursor:pointer}.action.primary{background:var(--brand);border-color:var(--brand);color:#fff}.marker{width:29px;height:29px;display:grid;place-items:center;border:3px solid #fff;border-radius:50% 50% 50% 0;color:#fff;font-size:13px;transform:rotate(-45deg);box-shadow:0 3px 9px #0004}.marker span{transform:rotate(45deg)}.marker-tags{display:flex;flex-wrap:wrap;gap:3px;max-width:140px;margin:-7px 0 0 17px}.marker-tag{display:block;max-width:86px;overflow:hidden;padding:3px 6px;border:1px solid #d5e4e0;border-radius:999px;background:#fff;color:#184d46;font-size:10px;font-weight:800;line-height:1.1;text-overflow:ellipsis;white-space:nowrap;box-shadow:0 2px 7px #173b3440}.leaflet-control-attribution{font-size:10px}
    .toolbar{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.tool-btn{border:1px solid #cfe0dc;border-radius:999px;background:#fff;padding:6px 10px;color:#087064;font-size:.78rem;font-weight:750;cursor:pointer}.tool-btn:hover{background:#eaf6f3}.tool-btn[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}.route-panel{margin-top:12px;padding:12px;border:1px solid #cfe0dc;border-radius:12px;background:#f4fbf9}.route-panel h2{margin:0 0 8px;font-size:.9rem}.route-panel label{display:block;margin-top:7px;color:var(--muted);font-size:.72rem;font-weight:700}.route-panel select{width:100%;margin-top:3px;padding:7px;border:1px solid #cfe0dc;border-radius:8px;background:#fff;color:var(--ink)}.route-options{display:flex;gap:10px;flex-wrap:wrap;margin-top:9px;color:var(--muted);font-size:.75rem}.route-options label{display:flex;align-items:center;gap:4px;margin:0;font-weight:600}.route-actions{display:flex;gap:7px;margin-top:9px}.route-summary{margin:9px 0 0;color:var(--brand);font-size:.78rem;font-weight:750}.route-steps{max-height:150px;overflow:auto;margin:8px 0 0;padding-left:20px;color:var(--muted);font-size:.73rem}.guide-links{margin-top:12px;padding:12px;border-top:1px solid var(--line)}.guide-links h2{margin:0 0 7px;font-size:.85rem}.guide-links a{display:block;padding:4px 0;color:var(--brand);font-size:.78rem;font-weight:700;text-decoration:none}.guide-links a:hover{text-decoration:underline}
    .map-status{position:absolute;z-index:900;left:18px;top:18px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 13px;font-size:.82rem;color:var(--muted);box-shadow:0 8px 22px #16473d16}.map-status[data-type="error"]{color:#b5432f;border-color:#f2cfc4}
    .user-marker{width:18px;height:18px;border-radius:50%;background:#2563eb;border:3px solid #fff;box-shadow:0 0 0 5px #2563eb33}
    .result-distance{color:var(--brand);font-weight:750}
    .result-media-placeholder,.detail-media-placeholder{display:grid;place-items:center;color:#fff;font-weight:800;background:linear-gradient(135deg,#087f72,#58a89c)}.interaction-box{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}.interaction-actions{display:flex;gap:7px;flex-wrap:wrap}.interaction-button{border:1px solid #cfe0dc;border-radius:10px;background:#fff;padding:7px 10px;color:var(--brand);font-weight:750;cursor:pointer}.interaction-button.active{background:var(--brand);color:#fff}.comment-form{display:flex;gap:7px;margin-top:10px}.comment-form textarea{min-width:0;flex:1;resize:vertical;border:1px solid #cfe0dc;border-radius:9px;padding:8px}.comment-list{display:grid;gap:8px;margin-top:10px}.comment-item{padding:8px;border-radius:9px;background:#f4fbf9;font-size:.78rem}.comment-item p{margin:0}.comment-meta{display:flex;justify-content:space-between;color:var(--muted);font-size:.68rem;margin-bottom:3px}.comment-status{margin:7px 0 0;color:var(--muted);font-size:.75rem}
    .comment-filter{display:flex;gap:5px;margin-top:10px}.comment-filter button{border:1px solid #cfe0dc;border-radius:999px;background:#fff;padding:4px 8px;color:var(--brand);font-size:.72rem;font-weight:750;cursor:pointer}.comment-filter button[aria-pressed="true"]{background:var(--brand);color:#fff}.comment-author{display:flex;align-items:center;gap:6px}.comment-avatar{display:grid;place-items:center;position:relative;width:27px;height:27px;overflow:hidden;border-radius:50%;background:#087f72;color:#fff;font-size:.62rem;font-weight:800}.comment-avatar img{position:absolute;width:100%;height:100%;object-fit:cover}.comment-author small{display:block;color:var(--muted);font-size:.61rem}.comment-meta time{margin-left:auto}
    .comment-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}.comment-actions button{border:0;background:transparent;color:var(--brand);padding:2px 0;font-size:.7rem;font-weight:800;cursor:pointer}.comment-reply-form{display:flex;gap:6px;margin-top:7px}.comment-reply-form textarea{min-width:0;flex:1;border:1px solid #cfe0dc;border-radius:8px;padding:6px;resize:vertical}.comment-replies{display:grid;gap:7px;margin:8px 0 0 16px;padding:8px 0 0 10px;border-left:2px solid #9fd7ce}.comment-replies>span{color:var(--brand);font-size:.68rem;font-weight:800}.comment-item.is-pinned{border:1px solid #75cabb;background:#e1f5f0}
    button.label{border:0;cursor:pointer;font:inherit}.map-marker-icon{background:transparent;border:0}.map-marker-icon .marker-tag{pointer-events:none}
    body.theme-dark .sidebar{background:#0c1b27}body.theme-dark .search,body.theme-dark .chip,body.theme-dark .tool-btn,body.theme-dark .route-panel,body.theme-dark .route-panel select,body.theme-dark .detail,body.theme-dark .action,body.theme-dark .map-status,body.theme-dark .interaction-button,body.theme-dark .comment-filter button,body.theme-dark .comment-form textarea,body.theme-dark .comment-reply-form textarea{border-color:#365564;background:#102735;color:var(--ink)}body.theme-dark .result:hover,body.theme-dark .result.active,body.theme-dark .route-panel,body.theme-dark .comment-item{background:#142e3d}body.theme-dark .result p,body.theme-dark .detail-summary,body.theme-dark .detail-more{color:var(--muted)}body.theme-dark .label{background:#173c45;color:#8de0d4}body.theme-dark .detail-close{background:#1b3948;color:var(--ink)}body.theme-dark .map-status{box-shadow:0 8px 22px #0008}body.theme-dark .comment-replies{border-color:#3d7b78}body.theme-dark .comment-item.is-pinned{border-color:#4faaa0;background:#183941}body.theme-dark .leaflet-tile{filter:brightness(.62) saturate(.72) hue-rotate(145deg)}body.theme-dark .leaflet-control-zoom a{background:#102735;color:#edf5f8;border-color:#365564}body.theme-dark .marker-tag{border-color:#365564;background:#102735;color:#d7f5ef}
    @media(max-width:820px){.page{width:min(100% - 18px,1440px);margin:12px auto}.head{align-items:flex-start}.head p{display:none}.explorer{grid-template-columns:1fr;height:auto;min-height:0}.sidebar{border-right:0;border-bottom:1px solid var(--line);max-height:330px}.map-zone{height:min(42svh,380px);min-height:280px}.detail{left:10px;bottom:10px;width:calc(100% - 20px);max-height:calc(100% - 20px)}}@media(max-width:420px){.map-zone{height:35svh;min-height:250px}.sidebar .search-wrap{padding:12px}.results{max-height:220px}}
    .search-wrap{flex:0 0 auto;max-height:64%;overflow-y:auto}
    .results{flex:1;min-height:0;overflow-y:auto}
    .route-steps{max-height:220px;overflow-y:auto;padding-right:8px;scrollbar-width:thin}
    @media(max-width:820px){.sidebar{max-height:none}.search-wrap{max-height:420px}.results{max-height:280px}}
    body{font-family:'Montserrat-Regular','Montserrat',sans-serif}
    .search,.chip,.tool-btn,.action,.interaction-button,.comment-filter button,.detail-close{min-height:44px}
    .search,.route-panel select,.comment-form textarea,.comment-reply-form textarea{font-size:16px}
    .tool-btn,.chip,.action,.interaction-button{display:inline-flex;align-items:center;justify-content:center}
    .detail-close{width:44px;height:44px}
  </style>

<body>
  <main class="page">
    <header class="head"><div><h1>Explorá Salto</h1><p>Elegí un punto para conocerlo sin perder su ubicación en el mapa.</p></div><div><button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="false">Modo oscuro</button> <a class="back" href="index.html">← Volver al inicio</a></div></header>
    <section class="explorer" aria-label="Mapa de lugares y patrimonio">
      <aside class="sidebar"><div class="search-wrap"><input id="search" class="search" type="search" placeholder="Buscar lugares, patrimonio o categorías" aria-label="Buscar en el mapa"><div id="chips" class="chips" aria-label="Categorías"></div><div class="toolbar"><button id="locate" class="tool-btn" type="button">📍 Usar mi ubicación</button><button id="clear-filters" class="tool-btn" type="button" hidden>Limpiar filtros</button></div><section class="route-panel" aria-labelledby="route-title"><h2 id="route-title">Cómo llegar</h2><label for="route-origin">Desde</label><select id="route-origin"><option value="user">Mi ubicación</option></select><label for="route-destination">Hasta</label><select id="route-destination"><option value="">Elegí un punto</option></select><label for="route-mode">Medio de transporte</label><select id="route-mode"><option value="car">🚗 Auto</option><option value="bike">🚲 Bicicleta</option><option value="foot">🚶 A pie</option></select><div class="route-options"><label><input id="avoid-tolls" type="checkbox"> Evitar peajes</label><label><input id="avoid-highways" type="checkbox"> Evitar autopistas</label></div><div class="route-actions"><button id="route-calculate" class="tool-btn" type="button">Calcular ruta</button><button id="route-clear" class="tool-btn" type="button">Limpiar</button></div><p id="route-summary" class="route-summary" aria-live="polite"></p><ol id="route-steps" class="route-steps" hidden></ol></section><section class="guide-links" aria-labelledby="guide-title"><h2 id="guide-title">Guías SIGTUR</h2><a href="index.html#lugares">Lugares recomendados</a><a href="lugares.html#plaza-artigas">Guía: Plaza Artigas</a><a href="lugares.html#costanera-norte">Guía: Costanera Norte</a><a href="lugares.html#parque-solari">Guía: Parque Solari</a><a href="lugares.html#plaza-33">Guía: Plaza Treinta y Tres</a></section></div><div id="results" class="results" aria-live="polite"></div></aside>
      <div class="map-zone"><div id="map" role="region" aria-label="Mapa interactivo de Salto"></div><div id="map-status" class="map-status" role="status" aria-live="polite" hidden></div><article id="detail" class="detail" hidden></article></div>
    </section>
  </main>
  <script src="../js/api-config.js"></script>
